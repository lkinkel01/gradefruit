<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gradefruit — keine Verbindung</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    padding: 32px;
    background: #F7F7F8;
    color: #131315;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    text-align: center;
  }
  @media (prefers-color-scheme: dark) { body { background: #131315; color: #F7F7F8; } }
  h1 { margin: 0 0 10px; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  p { max-width: 32ch; margin: 0 auto; font-size: 15px; line-height: 1.6; opacity: .68; }
  .repair { margin-top: 26px; font-size: 13px; opacity: .5; }
  .link {
    display: inline; margin: 0; padding: 0; min-height: 0;
    border: 0; background: none; color: inherit;
    font: inherit; text-decoration: underline; cursor: pointer;
  }
  button {
    margin-top: 22px; min-height: 44px; padding: 12px 20px;
    border: 0; border-radius: 12px;
    background: #DC5A15; color: #fff;
    font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
  }
</style>
</head>
<body>
  <div>
    <h1>Keine Verbindung</h1>
    <p>Gradefruit braucht gerade Internet. Sobald du wieder online bist, geht es genau dort weiter, wo du warst.</p>
    <button onclick="location.reload()">Erneut versuchen</button>
    <!-- Notausstieg. Muss auf DIESER Seite stehen: Wenn die App nicht mehr
         lädt, ist sie das Einzige, was der Nutzer noch sieht — der Ausschalter
         in der App wäre dann unerreichbar. -->
    <p class="repair">
      Klappt es auch mit Internet nicht?
      <button class="link" onclick="reparieren()">Zwischenspeicher leeren</button>
    </p>
  </div>
<script>
  async function reparieren() {
    try {
      const registrations = await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations.map(r => r.unregister()));
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    } catch (e) { /* Nichts zu leeren */ }
    location.reload();
  }
</script>
</body>
</html>
