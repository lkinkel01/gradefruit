<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gradefruit</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; padding: 32px;
    padding-top: calc(32px + env(safe-area-inset-top, 0px));
    background: #F7F7F8; color: #131315;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    text-align: center;
  }
  @media (prefers-color-scheme: dark) { body { background: #131315; color: #F7F7F8; } }
  .mark { width: 46px; height: 46px; margin: 0 auto 18px; }
  h1 { margin: 0 0 10px; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  p { margin: 0 auto; max-width: 32ch; font-size: 15px; line-height: 1.6; opacity: .7; }
  button {
    margin-top: 24px; min-height: 46px; padding: 12px 22px;
    border: 0; border-radius: 12px;
    background: #DC5A15; color: #fff;
    font: inherit; font-size: 15px; font-weight: 650; cursor: pointer;
  }
</style>
</head>
<body>
  <div>
    <svg class="mark" viewBox="0 0 48 48" aria-hidden="true">
      <circle cx="24" cy="26" r="15" fill="none" stroke="#FF7A00" stroke-width="5" stroke-linecap="round"
              stroke-dasharray="70 24" transform="rotate(-40 24 26)" />
      <path d="M24 11c4 0 8 3 9 7-4 2-9 2-13 0 1-4 4-7 4-7z" fill="#E5202C" />
    </svg>
    <h1>Keine Verbindung</h1>
    <p>
      Gradefruit konnte gerade nicht geladen werden. Prüfe dein Netz und
      versuche es noch einmal. Themen, die du schon geöffnet hattest, stehen
      dir danach auch ohne Netz zur Verfügung.
    </p>
    <button type="button" onclick="location.replace('https://www.gradefruit.de/')">
      Erneut versuchen
    </button>
  </div>
</body>
</html>
